<script>
    const MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

    function parseShowDate(dateStr) {
        const m = dateStr.match(/^(\w{3})\s+(\d+)/);
        if (!m) return null;
        const month = MONTHS[m[1]];
        const day = parseInt(m[2], 10);
        if (month === undefined || isNaN(day)) return null;
        const today = new Date();
        let year = today.getFullYear();
        const showDate = new Date(year, month, day);
        if (showDate < today && month <= 5 && today.getMonth() >= 6) {
            year += 1;
            showDate.setFullYear(year);
        }
        return new Date(year, month, day);
    }

    async function getShows() {
        const response = await fetch('shows.json');
        const shows = await response.json();
        return shows;
    }

    function formatTimePlace(show) {
        const parts = ['@ ' + show.place];
        if (show.time) parts.push(show.time);
        return parts.join(', ');
    }

    async function renderShows(shows) {
        const pastContainer = document.getElementById('past-shows-container');
        const upcomingContainer = document.getElementById('shows-container');
        pastContainer.innerHTML = '';
        upcomingContainer.innerHTML = '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const pastShows = shows.filter(show => {
            const d = parseShowDate(show.date);
            return d && d.getTime() < today.getTime();
        });
        const upcomingShows = shows.filter(show => {
            const d = parseShowDate(show.date);
            return d && d.getTime() >= today.getTime();
        });
        pastShows.forEach(show => {
            pastContainer.innerHTML += `<p><span class="date">${show.date}</span> ${show.artists} <span class="time-place">${formatTimePlace(show)}</span></p>`;
        });
        upcomingShows.forEach(show => {
            upcomingContainer.innerHTML += `<p><span class="date">${show.date}</span> ${show.artists} <span class="time-place">${formatTimePlace(show)}</span></p>`;
        });
    }

    async function main() {
        try {
            const shows = await getShows();
            await renderShows(shows);
        } catch (e) {
            console.error(e);
            document.getElementById('shows-container').innerHTML = '<p>Could not load shows.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', main);


</script>

<body>
    <header>
        <p><a href="mailto:phillydotshow@gmail.com">submit a show</a></p>
    </header>
    <details id="past-shows">
        <summary>Past Shows</summary>

    </details>
    <main id="shows-container"></main>
