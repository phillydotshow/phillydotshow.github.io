<script>
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function toYMD(str) {
        // "Mar 10 (Tue)" -> "2026-03-10"
        // The weekday in parens uniquely resolves the real year, which lets us
        // correctly distinguish a past show (earlier this year) from a future
        // one (next year) even though shows.json stores no explicit year.
        const m = str.match(/^(\w{3})\s+(\d+)\s*\((\w{3})\)/);
        if (!m) return '';
        const mi = MONTHS.indexOf(m[1]);
        if (mi === -1) return '';
        const day = Number(m[2]);
        const wd = WEEKDAYS.indexOf(m[3]);
        if (wd === -1) return '';
        const now = new Date();
        const yNow = now.getFullYear();
        for (let dy = -1; dy <= 1; dy++) {
            const y = yNow + dy;
            if (new Date(y, mi, day).getDay() === wd) {
                return y + '-' + String(mi + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            }
        }
        return '';
    }

    function row(show) {
        return '<p><span class="date">' + show.date + '</span> ' + show.artists + ' <span class="time-place">@ ' + show.place + (show.time ? ', ' + show.time : '') + '</span></p>';
    }

    function renderShows(shows) {
        // Local date (not UTC) so a show happening "today" isn't pushed to
        // past by the timezone offset (Philly is UTC-4/-5).
        const now = new Date();
        const today = now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0');
        const past = [], upcoming = [];
        for (const show of shows) {
            const date = toYMD(show.date);
            if (date) (date < today ? past : upcoming).push(show);
        }
        document.getElementById('past-shows-container').innerHTML = past.map(row).join('');
        document.getElementById('shows-container').innerHTML = upcoming.map(row).join('');
    }

    async function main() {
        try {
            const shows = await (await fetch('shows.json')).json();
            renderShows(shows);
        } catch (e) {
            console.error(e);
            document.getElementById('shows-container').innerHTML = '<p>Could not load shows.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', main);


</script>

<body>

    </details>
