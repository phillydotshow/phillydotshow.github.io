<html lang="en">

<head>

    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philly Shows</title>
</head>
<style>
    @font-face {
        font-family: Pitch;
        src: url('./assets/test-pitch-regular.woff2');
        font-weight: 400;
    }

    @font-face {
        font-family: Pitch;
        src: url('./assets/test-pitch-medium.woff2');
        font-weight: 500;
    }

    @font-face {
        font-family: Pitch;
        src: url('./assets/test-pitch-bold.woff2');
        font-weight: 700;
    }

    body {
        font-family: "Pitch", courier, monospace;
        font-weight: 400;
        font-style: normal;
        background-color: #000;
        color: #fff;
        font-size: 17px;
        padding: 0 10px;
        color: #fff;
        line-height: 1.25;
    }

    span.date {
        /* color: #f4e098; */
        font-weight: 800;
        font-variation-settings: "ROND" 0;
        /* margin-right: .25rem; */
    }

    span.time-place {
        /* color: hsl(10, 100%, 89%); */
        /* color: #fff0bc; */
        font-weight: 700;
        font-variation-settings: "ROND" 0;
    }

    details p {
        color: #aaa;
        border-left: 2px solid #fff;
        padding-left: 10px;
    }

    header {
        margin-bottom: 1.5rem;
    }

    footer {
        font-style: italic;

    }

    a:hover {
        color: rgb(255, 145, 0);
    }

    a:active {
        color: #ff0;
    }
</style>
<script>
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function toYMD(str) {
        const match = str.match(/^(\w{3})\s+(\d+)/);
        if (!match) return '';
        const mi = MONTHS.indexOf(match[1]);
        if (mi === -1) return '';
        const now = new Date();
        let y = now.getFullYear();
        const m = String(mi + 1).padStart(2, 0);
        const d = String(Number(match[2])+1).padStart(2, 0);
        const s = y + '-' + m + '-' + d;
        if (s < now.toISOString().slice(0, 10) && mi <= 5 && now.getMonth() >= 6) y++;
        return `${y}-${m}-${d}`;

    }

    function row(show) {
        return '<p><span class="date">' + show.date + '</span> ' + show.artists + ' <span class="time-place">@ ' + show.place + (show.time ? ', ' + show.time : '') + '</span></p>';
    }

    function renderShows(shows) {
        const today = new Date().toISOString().slice(0, 10);
        const past = [], upcoming = [];
        for (const show of shows) {
            const date = toYMD(show.date);
            if (date) (date < today ? past : upcoming).push(show);
        }
        document.getElementById('past-shows-container').innerHTML = past.map(row).join('');
        document.getElementById('shows-container').innerHTML = upcoming.map(row).join('');
    }

    async function main() {
        try {
            const shows = await (await fetch('shows.json')).json();
            renderShows(shows);
        } catch (e) {
            console.error(e);
            document.getElementById('shows-container').innerHTML = '<p>Could not load shows.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', main);


</script>

<body>
    <header>
        <p><a href="mailto:phillydotshow@gmail.com">submit a show</a></p>
    </header>
    <details id="past-shows">
        <summary>Past Shows</summary>
        <div id="past-shows-container"></div>
    </details>
    <main id="shows-container"></main>

    </footer>
</body>
